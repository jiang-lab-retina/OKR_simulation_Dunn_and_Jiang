[project]
name = "okr-models"
version = "1.0.0"
description = "Motion (Lucas-Kanade) and optotype (template matching) models with simulated scotomas: code for Fig 4 and Fig S5"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.18.1",
    "opencv-python-headless==4.11.0.86",
    "matplotlib==3.10.8",
]

[project.scripts]
okr-models = "okr_models.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okr_models"]
